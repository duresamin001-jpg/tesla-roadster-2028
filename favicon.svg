<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#00BFFF" />
    </linearGradient>
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Rocket / Thruster Pulse Arc -->
  <ellipse cx="256" cy="380" rx="90" ry="16" fill="none" stroke="#FF5900" stroke-width="6" opacity="0.8" />
  <ellipse cx="256" cy="380" rx="60" ry="8" fill="none" stroke="#00BFFF" stroke-width="4" opacity="0.9" />

  <!-- Car Silhouette & Laser Lightbar -->
  <path d="M 190 240 C 215 190, 297 190, 322 240 Z" fill="#000" stroke="#00BFFF" stroke-width="4" />
  <path d="M 120 310 C 130 270, 160 250, 200 240 C 230 234, 282 234, 312 240 C 352 250, 382 270, 392 310 C 370 330, 320 345, 256 345 C 192 345, 142 330, 120 310 Z" fill="#1E293B" stroke="#475569" stroke-width="4" />
  
  <g filter="url(#intenseGlow)">
    <path d="M 136 308 Q 256 324 376 308" fill="none" stroke="url(#laserGrad)" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Tesla T Logo in glowing cyan -->
  <g transform="translate(256, 140) scale(1.6)">
    <path d="M -16 -12 C -6 -6, 6 -6, 16 -12 C 12 -7, -12 -7, -16 -12 Z" fill="#00BFFF" />
    <path d="M 0 -4 L 0 16" stroke="#00BFFF" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
