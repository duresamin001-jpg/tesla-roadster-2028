<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Titanium Mesh Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Supercar Body Paint Gradient (Deep Tesla Ruby Red with Metallic Sheen) -->
    <linearGradient id="carBodyGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#E82127" />
      <stop offset="35%" stop-color="#C00C12" />
      <stop offset="70%" stop-color="#880004" />
      <stop offset="100%" stop-color="#3D0002" />
    </linearGradient>

    <!-- Cyber Laser Headlight Beam -->
    <linearGradient id="laserCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#00BFFF" />
    </linearGradient>

    <!-- SpaceX Thruster Glow Gradient -->
    <radialGradient id="thrusterPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#FF5900" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter for Headlights & Thruster -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS Squircle App Icon Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)" />
  <rect width="510" height="510" x="1" y="1" rx="114" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- SpaceX Cold-Gas Underbody Levitation Rings -->
  <ellipse cx="256" cy="405" rx="150" ry="24" fill="url(#thrusterPulse)" />
  <ellipse cx="256" cy="405" rx="90" ry="12" fill="none" stroke="#00E5FF" stroke-width="3" opacity="0.8" />
  <ellipse cx="256" cy="405" rx="45" ry="6" fill="#FFFFFF" opacity="0.9" filter="url(#glow)" />

  <!-- Thruster Particle Sparks -->
  <circle cx="160" cy="400" r="3" fill="#00E5FF" opacity="0.8" />
  <circle cx="352" cy="400" r="3" fill="#00E5FF" opacity="0.8" />
  <circle cx="210" cy="415" r="2.5" fill="#FF7700" opacity="0.9" />
  <circle cx="302" cy="415" r="2.5" fill="#FF7700" opacity="0.9" />

  <!-- Aerodynamic Car Silhouette -->
  <!-- Glass Canopy (Cockpit) -->
  <path d="M 185 245 C 210 185, 302 185, 327 245 Z" fill="#0B132B" stroke="#00E5FF" stroke-width="2" opacity="0.9" />
  <!-- Windshield Reflection Streak -->
  <path d="M 215 235 C 235 198, 275 198, 295 235" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" />

  <!-- Sculpted Roadster Carbon Body Panels -->
  <path d="M 105 330 C 115 275, 155 255, 195 245 C 225 238, 287 238, 317 245 C 357 255, 397 275, 407 330 C 390 355, 335 372, 256 372 C 177 372, 122 355, 105 330 Z" 
        fill="url(#carBodyGrad)" stroke="#FF2E36" stroke-width="2" />

  <!-- Front Splitter & Air Diffuser -->
  <path d="M 140 345 Q 256 368 372 345 L 360 360 Q 256 376 152 360 Z" fill="#0A0F1D" />

  <!-- Distinctive Tesla Roadster Laser Headlights with Bloom -->
  <g filter="url(#intenseGlow)">
    <!-- Left Laser Blade -->
    <path d="M 130 318 Q 170 322 195 330" fill="none" stroke="url(#laserCyan)" stroke-width="7" stroke-linecap="round" />
    <!-- Right Laser Blade -->
    <path d="M 382 318 Q 342 322 317 330" fill="none" stroke="url(#laserCyan)" stroke-width="7" stroke-linecap="round" />
    <!-- Continuous Cyber Center Lightbar -->
    <path d="M 195 330 Q 256 335 317 330" fill="none" stroke="url(#laserCyan)" stroke-width="3.5" opacity="0.8" />
  </g>

  <!-- Tesla Emblem "T" Crest -->
  <g transform="translate(256, 115) scale(1.75)">
    <!-- Top Arc Wings -->
    <path d="M -22 -14 C -8 -7, 8 -7, 22 -14 C 16 -9, -16 -9, -22 -14 Z" fill="#FFFFFF" />
    <!-- Center Blade -->
    <path d="M -5.5 -5 L 5.5 -5 L 3.5 10 L 0 20 L -3.5 10 Z" fill="#FFFFFF" />
    <!-- Glow aura around Tesla T -->
    <circle cx="0" cy="4" r="18" fill="#00E5FF" opacity="0.25" filter="url(#glow)" />
  </g>

  <!-- Modern Year Subtitle "2028" -->
  <text x="256" y="475" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="24" font-weight="900" letter-spacing="9" fill="#00E5FF" opacity="0.95">
    ROADSTER 2028
  </text>
</svg>
