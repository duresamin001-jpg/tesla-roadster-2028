<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Electric Accent Glow -->
    <radialGradient id="electricGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#00BFFF" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#007BFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#007BFF" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Edge Ring -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFFF" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#1E293B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#007BFF" stop-opacity="0.6" />
    </linearGradient>

    <!-- Laser Lightbar Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#00BFFF" />
    </linearGradient>

    <!-- Body Highlight Gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="30%" stop-color="#94A3B8" />
      <stop offset="70%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Thruster Flame Gradient -->
    <linearGradient id="thrusterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BFFF" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#FF5900" />
      <stop offset="100%" stop-color="#FF1A00" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feComposite in="SourceGraphic" in2="blur2" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base App Icon Shape (Apple iOS style) -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Ambient Thruster & Cockpit Center Glow -->
  <circle cx="256" cy="275" r="180" fill="url(#electricGlow)" />

  <!-- Aerodynamic Grid Horizon Lines -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="1.5">
    <line x1="80" y1="380" x2="432" y2="380" />
    <line x1="120" y1="410" x2="392" y2="410" />
    <line x1="160" y1="435" x2="352" y2="435" />
    <line x1="256" y1="360" x2="256" y2="460" />
    <line x1="200" y1="360" x2="140" y2="460" />
    <line x1="312" y1="360" x2="372" y2="460" />
  </g>

  <!-- SpaceX Cold-Gas Thruster Pulse Wave at Base -->
  <g filter="url(#intenseGlow)">
    <ellipse cx="256" cy="382" rx="110" ry="14" fill="none" stroke="url(#thrusterGrad)" stroke-width="5" opacity="0.85" />
    <ellipse cx="256" cy="382" rx="60" ry="6" fill="#00E5FF" opacity="0.6" />
  </g>

  <!-- Aerodynamic Roadster Silhouette -->
  <!-- Low, Aggressive Coupe Roofline & Body -->
  <g id="roadsterCarBody" transform="translate(0, -10)">
    <!-- Cabin Glass / Canopy -->
    <path d="M 188 238 C 215 190, 297 190, 324 238 Z" fill="#030712" stroke="#38BDF8" stroke-width="2" opacity="0.9" />

    <!-- Sleek Front Hood & Fenders Silhouette -->
    <path d="M 116 312 
             C 125 285, 150 262, 185 248 
             C 215 236, 297 236, 327 248 
             C 362 262, 387 285, 396 312 
             C 382 328, 335 344, 256 344 
             C 177 344, 130 328, 116 312 Z" 
          fill="url(#bodyGrad)" 
          stroke="#1E293B" 
          stroke-width="2" />

    <!-- Center Hood Crease Highlight Lines -->
    <path d="M 256 244 L 256 310" stroke="#00BFFF" stroke-width="2" opacity="0.6" />
    <path d="M 205 258 L 180 305" stroke="#38BDF8" stroke-width="1.5" opacity="0.4" />
    <path d="M 307 258 L 332 305" stroke="#38BDF8" stroke-width="1.5" opacity="0.4" />

    <!-- Signature Front LED Laser Lightbar & Headlights -->
    <g filter="url(#intenseGlow)">
      <!-- Main Continuous Horizon Lightbar -->
      <path d="M 132 308 Q 256 322 380 308" fill="none" stroke="url(#laserGrad)" stroke-width="5" stroke-linecap="round" />
      <!-- Left Laser Blade Headlight -->
      <path d="M 126 304 L 168 312" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
      <!-- Right Laser Blade Headlight -->
      <path d="M 386 304 L 344 312" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    </g>

    <!-- Tesla Aerodynamic Front Nose Badge -->
    <g transform="translate(256, 322)">
      <path d="M -9 -8 C -4 -4, 4 -4, 9 -8 C 7 -4, -7 -4, -9 -8 Z" fill="#FFFFFF" />
      <path d="M 0 -3 L 0 5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Lower Carbon Fiber Splitter -->
    <path d="M 148 332 Q 256 345 364 332" fill="none" stroke="#00BFFF" stroke-width="3" opacity="0.8" />
  </g>

  <!-- Futuristic "ROADSTER 2028" Typography Brand Accent -->
  <g transform="translate(256, 125)" text-anchor="middle">
    <text font-family="'Inter', -apple-system, system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="6" fill="#FFFFFF">
      ROADSTER
    </text>
    <text y="28" font-family="'Inter', -apple-system, system-ui, sans-serif" font-weight="800" font-size="13" letter-spacing="8" fill="#00BFFF">
      2028 • FLYING CAR
    </text>
  </g>

  <!-- Top Glass Highlight Sheen across Icon Corner -->
  <path d="M 10 120 C 10 60, 60 10, 120 10 L 260 10 C 120 70, 70 120, 10 260 Z" fill="#FFFFFF" opacity="0.06" />
</svg>
